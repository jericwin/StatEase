name: Keep API warm

# Render's free plan sleeps after 15 idle minutes; a cold start takes about a minute.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://statease.vercel.app/api/v1/health
