services:
  - type: web
    name: statease-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    # Same AWS region as the Neon database (us-east-1).
    region: virginia
    healthCheckPath: /api/v1/health
    envVars:
      - key: STATEASE_ENVIRONMENT
        value: production
      - key: STATEASE_AUTH_MODE
        value: password
      - key: STATEASE_SECRET_KEY
        generateValue: true
      - key: STATEASE_DATABASE_URL
        sync: false
      - key: STATEASE_PUBLIC_URL
        value: https://statease.vercel.app
      # The free plan has no persistent disk: keep datasets and exports in the database as well.
      - key: STATEASE_PERSIST_FILES_IN_DB
        value: "true"
      - key: STATEASE_ENABLE_PYTHON_CONSOLE
        value: "false"
      - key: STATEASE_ANALYSIS_WORKERS
        value: "1"
      - key: STATEASE_GOOGLE_CLIENT_ID
        sync: false
      - key: STATEASE_GOOGLE_CLIENT_SECRET
        sync: false
      # Render's free plan blocks SMTP ports; mail goes through the Gmail API (scripts/gmail_token.py).
      - key: STATEASE_GMAIL_REFRESH_TOKEN
        sync: false
      - key: STATEASE_SMTP_HOST
        value: smtp.gmail.com
      - key: STATEASE_SMTP_PORT
        value: "587"
      - key: STATEASE_SMTP_USERNAME
        value: punay.jeric@gmail.com
      - key: STATEASE_SMTP_PASSWORD
        sync: false
      - key: STATEASE_SMTP_FROM
        value: StatEase Analytics <punay.jeric@gmail.com>
      - key: STATEASE_SMTP_STARTTLS
        value: "true"
      - key: STATEASE_CORS_ORIGINS
        value: '["https://statease.vercel.app"]'
      # Requests arrive through Vercel and Render's proxy; take the client address from X-Forwarded-For.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
